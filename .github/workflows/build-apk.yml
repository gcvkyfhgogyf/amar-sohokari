name: Build Amar Shohayok APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'AmarShohayok.zip'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source directory
        shell: bash
        run: |
          if [ -f "AmarShohayok.zip" ]; then
            mkdir -p "$GITHUB_WORKSPACE/build-source"
            unzip -q "AmarShohayok.zip" -d "$GITHUB_WORKSPACE/build-source"
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/build-source" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK with Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p ${{ env.PROJECT_DIR }} assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-shohayok-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
